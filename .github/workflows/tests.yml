name: tests

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Syntax check
        run: python -m compileall -q cloud_audit cloud_audit_cli.py tests
      - name: Validate OS EOL data
        run: python -c "import json; json.load(open('cloud_audit/data/os_eol.json', encoding='utf-8'))"
      - name: Run tests (no cloud SDKs or credentials needed)
        run: |
          python tests/test_cloud.py
          python tests/test_collectors.py
